name: CI
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: tlc, POSTGRES_PASSWORD: tlc, POSTGRES_DB: tlc }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tlc" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://tlc:tlc@localhost:5432/tlc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      # Troque por "npm ci" depois de commitar o package-lock.json (gerado no primeiro "npm install").
      - run: npm install
      - run: npm run lint -w @tlc/api
      - run: npm run build -w @tlc/api
      - run: npm test -w @tlc/api
      # FUN-03: a migração roda do zero e cria as 35 tabelas e os dados iniciais
      - run: npm run db:migrate
      - run: npm run db:verify
      # Rodar de novo não pode mudar nada
      - run: npm run db:migrate

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: npm install
      - run: npm run typecheck -w @tlc/web
      - run: npm run lint -w @tlc/web
      - run: npm run build -w @tlc/web
